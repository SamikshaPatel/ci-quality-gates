name: Nightly quality run

# Full gates on main every night, plus the quarantine review:
# quarantined tests run too, build a green streak, and leave quarantine after
# the configured number of clean nights. Overdue quarantines fail this run on purpose.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC, about 1 a.m. Toronto time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RB_USERNAME: ${{ secrets.RB_USERNAME }}
      RB_PASSWORD: ${{ secrets.RB_PASSWORD }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL || secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || secrets.JIRA_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-env

      - name: "Gate 1 — Smoke"
        run: scripts/run-gate.sh smoke
      - name: "Gate 2 — Contract"
        run: scripts/run-gate.sh contract
      - name: "Gate 3 — Critical tier"
        run: scripts/run-gate.sh critical
      - name: "Gate 4 — Non-critical tier"
        run: scripts/run-regression.sh

      - name: Quarantine review (run quarantined tests, update green streaks)
        if: always() && hashFiles('quarantine.json') != ''
        run: |
          if [ "$(jq '.tests | length' quarantine.json)" -eq 0 ]; then
            echo "Quarantine is empty."; exit 0
          fi
          rm -rf api-tests/target/reports/quarantine ui-tests/target/reports/quarantine
          mvn -B -ntp -pl api-tests,ui-tests test -Dtier=quarantine -Dgroups=regression \
            -Dinclude.quarantined=true -Dsurefire.rerunFailingTestsCount=1 -Dmaven.test.failure.ignore=true
          java -jar gate-evaluator/target/gate-evaluator.jar review \
            --reports api-tests/target/reports/quarantine,ui-tests/target/reports/quarantine

      - name: Cache the Allure command line
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/allure
          key: allure-2.46.1

      - name: Allure report (every test, with trends)
        if: always()
        run: scripts/build-allure.sh || echo "::warning::The Allure report could not be built; the gates are unaffected."

      - name: Run report
        if: always()
        run: java -jar gate-evaluator/target/gate-evaluator.jar report

      - name: Open a quarantine review PR
        # main is protected, so even the bot goes through a PR: the quarantine change gets
        # the same gates and a human merge. Uses the bot token so the PR's gates actually run.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.QUALITY_BOT_TOKEN }}
        run: |
          if git diff --quiet -- quarantine.json; then
            echo "No quarantine changes tonight."; exit 0
          fi
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::warning::QUALITY_BOT_TOKEN is not set, so the quarantine review PR cannot be opened."
            git diff -- quarantine.json
            exit 0
          fi
          branch="bot/quarantine-review-${GITHUB_RUN_ID}"
          git config user.name "quality-gate-bot"
          git config user.email "quality-gate-bot@users.noreply.github.com"
          git checkout -b "${branch}"
          git add quarantine.json
          git commit -m "chore(quarantine): nightly review $(date -u +%F)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${branch}"
          gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${branch}" \
            --title "chore(quarantine): nightly review $(date -u +%F)" \
            --body-file gate-results/run-report.md

      - name: Publish to the run-history site
        if: always() && hashFiles('gate-results/history-entry.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publish-history.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-evidence-${{ github.run_id }}
          path: |
            gate-results/
            quarantine.json
            */target/reports/
            */target/allure-results/
          retention-days: 90
