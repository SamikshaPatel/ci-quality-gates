name: Quality gates

# Runs on every pull request, from the "Run workflow" button (pick a demo scenario),
# and as a reusable workflow for releases. CI_CONTRACT.md defines what green means.
#
# Demo scenarios on a pull request: put [demo:<scenario>] in the PR title, e.g.
# "[demo:flake-breach] Show quarantine on a PR". Demo PRs are evidence, never merged.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Demo scenario: which failure path to prove (none = normal run)"
        type: choice
        default: none
        options:
          - none
          - env-down
          - smoke-code
          - critical-flake
          - flake-breach
          - quarantine-cap
  workflow_call:
    inputs:
      scenario:
        type: string
        default: none

permissions:
  contents: write        # commit quarantine.json changes to the PR branch; publish run history
  pull-requests: write   # post the run report as a PR comment

# Runs for the same PR queue instead of cancelling each other, so every run finishes,
# posts its report and lands in the run history. A quarantine commit's run waits its turn.
concurrency:
  group: gates-${{ github.ref }}-${{ inputs.scenario || 'none' }}
  cancel-in-progress: false

jobs:
  gates:
    name: Smoke → Critical → Non-critical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # Credentials live in GitHub secrets, never in the repo. Tests fall back to the
      # public demo defaults when a secret is not set.
      RB_USERNAME: ${{ secrets.RB_USERNAME }}
      RB_PASSWORD: ${{ secrets.RB_PASSWORD }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL || secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || secrets.JIRA_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a PR, check out the branch itself so a quarantine commit can be pushed back to it.
          ref: ${{ github.head_ref || github.ref }}
          # The bot token (not GITHUB_TOKEN) is used for that push, because only a push made with
          # a real account's token starts a new pipeline run on the new commit. Without it the
          # PR's newest commit would have no green check and could never merge.
          token: ${{ secrets.QUALITY_BOT_TOKEN || github.token }}

      - name: Pick the demo scenario
        env:
          INPUT_SCENARIO: ${{ inputs.scenario }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          scenario="${INPUT_SCENARIO:-none}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            scenario="$(grep -oE '\[demo:[a-z-]+\]' <<< "${PR_TITLE}" | head -1 | sed -E 's/\[demo:([a-z-]+)\]/\1/' || true)"
          fi
          case "${scenario}" in
            env-down|smoke-code|critical-flake|flake-breach|quarantine-cap) ;;
            *) scenario="none" ;;
          esac
          echo "DEMO_SCENARIO=${scenario}" >> "$GITHUB_ENV"
          echo "Demo scenario: ${scenario}"

      - uses: ./.github/actions/setup-env

      - name: "Demo scenario env-down: stop the API mid-pipeline"
        if: env.DEMO_SCENARIO == 'env-down'
        run: docker compose -f docker-compose.ci.yml stop restful-booker

      - name: "Gate 1 — Smoke (100%, no retries)"
        id: smoke
        run: scripts/run-gate.sh smoke

      - name: "Gate 2 — Critical tier (100%, no retry credit)"
        id: critical
        run: scripts/run-gate.sh critical

      - name: "Gate 3 — Non-critical tier (pass rate and flake rate, quarantine)"
        id: regression
        run: scripts/run-regression.sh

      - name: Run report
        if: always()
        run: java -jar gate-evaluator/target/gate-evaluator.jar report

      - name: Publish to the run-history site
        if: >-
          always() && hashFiles('gate-results/history-entry.json') != ''
          && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publish-history.sh

      - name: Post run report on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('gate-results/run-report.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: run-report
          path: gate-results/run-report.md

      - name: Write the quarantine notice
        if: always() && github.event_name == 'pull_request' && hashFiles('gate-results/quarantine-changed') != ''
        run: |
          {
            echo "## Quarantine notice"
            echo
            echo "Run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) quarantined flaky tests on this PR."
            echo "The bot commits the updated \`quarantine.json\` to this branch, so the change shows in the PR diff, and the gates rerun on that commit."
            echo
            awk '/^### Quarantine$/{f=1; next} f && /^### /{exit} f && /^\*\*Evidence/{exit} f{print}' gate-results/run-report.md
          } > gate-results/quarantine-notice.md
          cat gate-results/quarantine-notice.md

      - name: Post the quarantine notice on the PR
        # A separate comment per quarantine event: the sticky run report shows the PR's current
        # status, while this keeps a permanent record of what was quarantined and why.
        if: always() && hashFiles('gate-results/quarantine-notice.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: quarantine-${{ github.run_id }}
          path: gate-results/quarantine-notice.md

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          cp -r gate-results evidence/ 2>/dev/null || true
          cp quarantine.json evidence/ 2>/dev/null || true
          for m in api-tests ui-tests; do
            mkdir -p "evidence/$m"
            cp -r "$m/target/reports" "evidence/$m/" 2>/dev/null || true
            cp -r "$m/target/allure-results" "evidence/$m/" 2>/dev/null || true
            cp -r "$m/target/traces" "evidence/$m/" 2>/dev/null || true
          done
          docker compose -f docker-compose.ci.yml logs --no-color > evidence/restful-booker.log 2>&1 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ env.DEMO_SCENARIO }}-${{ github.run_id }}
          path: evidence/
          retention-days: 90

      - name: Commit quarantine changes to the PR branch
        # Last step on purpose: the report, history and evidence are recorded first.
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('gate-results/quarantine-changed') != ''
        env:
          HAS_BOT_TOKEN: ${{ secrets.QUALITY_BOT_TOKEN != '' }}
        run: |
          if [[ "${HAS_BOT_TOKEN}" != "true" ]]; then
            echo "::warning::QUALITY_BOT_TOKEN is not set. The quarantine commit will not start a new run, so this PR cannot merge until someone pushes again."
          fi
          git config user.name "quality-gate-bot"
          git config user.email "quality-gate-bot@users.noreply.github.com"
          git add quarantine.json
          git commit -m "chore(quarantine): quarantine flaky tests from run ${GITHUB_RUN_ID}"
          git push
